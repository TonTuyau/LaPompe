name: Store credentials

# By hand (Actions → Store credentials → Run workflow): checks the `stores` environment's secrets against each store
# without publishing anything: signs in, and reads LaPompe's version there (scripts/publish-store.ts --check). It waits
# for the environment's approval, as a release's store jobs do (docs/STORES.md).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.store }} credentials
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: stores
    strategy:
      fail-fast: false
      matrix:
        store: [firefox, chrome]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Sign in and read LaPompe's version
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          CWS_SERVICE_ACCOUNT_KEY: ${{ secrets.CWS_SERVICE_ACCOUNT_KEY }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
        run: node scripts/publish-store.ts "${{ matrix.store }}" --check
